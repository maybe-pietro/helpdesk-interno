services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    depends_on:
      mysql:
        condition: service_healthy
      maildev:
        condition: service_started
    ports:
      - "4000:4000"
    volumes:
      - ./backend/src:/app/src
      - uploads_data:/app/uploads

  frontend:
    build: ./frontend
    restart: unless-stopped
    env_file: ./frontend/.env
    depends_on:
      - backend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src

  maildev:
    image: maildev/maildev
    restart: unless-stopped
    ports:
      - "1080:1080" # web UI to view sent emails
      - "1025:1025" # SMTP

  adminer:
    image: adminer
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080" # web UI to browse the database

volumes:
  mysql_data:
  uploads_data:
